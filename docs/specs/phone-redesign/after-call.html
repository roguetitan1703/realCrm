<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>After a call</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="phone.css"></head>
<body>
<div class="phone">
  <div class="top">
    <button class="back" aria-label="Back"><i data-i="back"></i></button>
    <div class="t"><b>Nikhil Chavan</b><span>Leads</span></div>
    <button class="ib"><i data-i="bell"></i></button>
  </div>
  <div class="body">
    <div class="card"><div class="id"><div class="av">NC</div><div><h1>Nikhil Chavan</h1><div class="fl">3 BHK · Rent · Fairhaven</div></div></div></div>
  </div>
  <div class="tabs"><div class="tab"></div></div>

  <div class="scrim"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="sh-h"><b>Nikhil Chavan</b><span>Call · 5:42 pm</span></div>

    <div class="lbl">What happened</div>
    <div class="chips">
      <button class="chip">Call not received</button>
      <button class="chip">Discussed</button>
      <button class="chip on">Asked to call back</button>
      <button class="chip">Sent details</button>
      <button class="chip">Coming for a visit</button>
      <button class="chip">Busy or switched off</button>
      <button class="chip">Not interested</button>
      <button class="chip">Booked elsewhere</button>
      <button class="chip">Wrong number</button>
    </div>

    <div class="lbl">Status</div>
    <div class="to">
      <span style="color:var(--muted);font-size:13px">Call Not Received</span>
      <span class="arrow"><i data-i="right"></i></span>
      <span class="v"><i></i>Callback</span>
      <span class="chg">Change</span>
    </div>

    <div class="lbl" style="display:flex;justify-content:space-between;align-items:center">Next <span class="kind">Call <i data-i="chev"></i></span></div>
    <div class="chips">
      <button class="chip sm">Today 7 pm</button>
      <button class="chip sm on">Tomorrow 11 am</button>
      <button class="chip sm">In 3 days</button>
      <button class="chip sm" aria-label="Pick a time"><i data-i="calendar"></i></button>
    </div>

    <div class="note" style="margin-top:10px">Add a note</div>

    <div class="foot">
      <button class="btn skip">Skip</button>
      <button class="btn pri">Save · Call tomorrow 11 am</button>
    </div>
  </div>
</div>
<script src="icons.js"></script>
</body></html>
