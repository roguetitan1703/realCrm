<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Team by agent</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="phone.css"></head>
<body>
<div class="phone">
  <div class="top">
    <div class="logo">D</div>
    <div class="t"><b>Today</b><span>Delpat</span></div>
    <button class="ib" aria-label="Search"><i data-i="search"></i></button>
    <button class="ib" aria-label="New lead"><i data-i="plus"></i></button>
    <button class="ib" aria-label="Notifications"><i data-i="bell"></i></button>
  </div>
  <div class="body">
    <div class="seg"><button>To do</button><button>My work</button><button class="on">Team</button></div>

    <div class="card" style="padding:12px 10px">
      <div class="ch" style="padding:0 4px"><span>By agent</span></div>
      <div class="thead"><div>Open</div><div>Over-<br>due</div><div>Not con-<br>tacted</div></div>
      <div class="agent">
        <div class="av">SK</div>
        <div class="w"><b>Siddhi</b><span class="late">11 Oct · 17 days</span></div>
        <div class="nums"><div>65</div><div class="alert">9</div><div class="alert">4</div></div>
      </div>
      <div class="agent">
        <div class="av">AN</div>
        <div class="w"><b>Aniket</b><span>Today 2:10 pm</span></div>
        <div class="nums"><div>31</div><div class="alert">6</div><div class="alert">2</div></div>
      </div>
      <div class="agent">
        <div class="av">KD</div>
        <div class="w"><b>Kavish</b><span>Today 5:39 pm</span></div>
        <div class="nums"><div>28</div><div class="alert">4</div><div class="alert">3</div></div>
      </div>
      <div class="agent">
        <div class="av">MO</div>
        <div class="w"><b>Mohit</b><span>Yesterday 6:02 pm</span></div>
        <div class="nums"><div>22</div><div class="alert">4</div><div class="zero">0</div></div>
      </div>
      <div class="agent">
        <div class="av">RS</div>
        <div class="w"><b>Rupali</b><span>Today 11:45 am</span></div>
        <div class="nums"><div>18</div><div class="alert">2</div><div class="zero">0</div></div>
      </div>
    </div>

    <div class="card">
      <div class="ch"><span>Team today</span></div>
      <div style="display:flex;gap:22px;font:600 20px var(--disp)">
        <div>14<div style="font:400 12px var(--sans);color:var(--muted)">calls</div></div>
        <div>9<div style="font:400 12px var(--sans);color:var(--muted)">picked up</div></div>
        <div>3<div style="font:400 12px var(--sans);color:var(--muted)">booked</div></div>
      </div>
    </div>
  </div>
  <div class="tabs">
    <div class="tab on"><span class="ic"><i data-i="home"></i></span>Today</div>
    <div class="tab"><span class="ic"><i data-i="list"></i></span>Leads</div>
    <div class="tab"><span class="ic"><i data-i="phone"></i></span>Calling</div>
    <div class="tab"><span class="ic"><i data-i="building"></i></span>Props</div>
    <div class="tab"><span class="ic"><i data-i="person"></i></span>Me</div>
  </div>
</div>
<script src="icons.js"></script>
</body></html>
