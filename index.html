<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/brand-mark.svg" />
    <!-- Platform identity. Swapped to the tenant's name once a workspace is
         selected (see src/data/platform.js + the title effect in App.jsx). -->
    <title>Real Estate by Delpat</title>
    <meta name="theme-color" content="#1E6F52" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Real Estate" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet" />
    <!--
      Tenant identity, resolved BEFORE the browser reads the manifest.

      This used to ship a hardcoded <link rel="manifest" href="/pwa/_platform/…">
      and let src/lib/pwa.js repoint it after React mounted. A PWA does not work
      that way: the browser captures name, icon, theme_color and start_url ONCE,
      at install, from whatever manifest the document was linking then. Anyone who
      installed before the swap landed — which is everyone, since the swap needs
      the bundle to boot — installed the platform manifest. That is the whole
      story behind the wrong icon, the stale app name, the green splash screen,
      and the app opening on the "type your firm name" prompt instead of the
      firm's own login: _platform is called "Real Estate by Delpat", is coloured
      #1E6F52, and starts at "/".

      So the link is written here, synchronously, from the slug in the URL —
      before the parser reaches any manifest element. Nothing to race.
    -->
    <script>
      (function() {
        try {
          var seg = decodeURIComponent(
            location.pathname.replace(/^\/+|\/+$/g, '').split('/')[0] || '');
          if (seg === 'admin') seg = '';
          var slug = new URLSearchParams(location.search).get('ws')
            || seg
            || localStorage.getItem('crm_tenant_id')
            || '_platform';
          var link = document.createElement('link');
          link.rel = 'manifest'; link.id = 'app-manifest';
          link.href = '/pwa/' + encodeURIComponent(slug) + '/manifest.webmanifest';
          document.head.appendChild(link);
          // iOS never reads the manifest for the home-screen icon — only this
          // link — so the tenant icon has to be here, not just in the manifest.
          var icon = document.createElement('link');
          icon.rel = 'apple-touch-icon'; icon.id = 'app-apple-icon';
          icon.setAttribute('sizes', '180x180');
          icon.href = '/pwa/' + encodeURIComponent(slug) + '/icon-180.png';
          document.head.appendChild(icon);
          // ...and the same is true of the caption under it: iOS takes
          // apple-mobile-web-app-title over the manifest's short_name. Both are
          // read at the moment the person taps "Add", which on a first visit is
          // long before the boot payload lands — so the last known firm name is
          // written here, synchronously, rather than waiting for React.
          var fn = localStorage.getItem('crm_firm_name_' + slug)
            || localStorage.getItem('crm_firm_name') || '';
          if (fn) {
            var tm = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (!tm) {
              tm = document.createElement('meta');
              tm.name = 'apple-mobile-web-app-title';
              document.head.appendChild(tm);
            }
            tm.content = fn;
          }
        } catch (e) {}
        try {
          var t = localStorage.getItem('crm_tenant_id') || '';
          var c = localStorage.getItem('crm_brand_color') || '';
          if (!c && t) {
            var raw = localStorage.getItem('crm_state_cache_' + t);
            if (raw) {
              var parsed = JSON.parse(raw);
              c = parsed && parsed.state && parsed.state.brand && parsed.state.brand.primaryColor;
            }
          }
          if (c && /^#?[a-f\d]{6}$/i.test(c)) {
            var root = document.documentElement.style;
            root.setProperty('--accent', c);
            var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(c);
            if (m) {
              var r = parseInt(m[1], 16), g = parseInt(m[2], 16), b = parseInt(m[3], 16);
              root.setProperty('--accent-rgb', r + ',' + g + ',' + b);
            }
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.content = c;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
