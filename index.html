<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/brand-mark.svg" />
    <!-- Platform identity. Swapped to the tenant's name once a workspace is
         selected (see src/data/platform.js + the title effect in App.jsx). -->
    <title>Real Estate by Delpat</title>
    <!-- PWA: default (platform) manifest; src/lib/pwa.js repoints these at the
         tenant's manifest/icon once a workspace is chosen. -->
    <link rel="manifest" id="app-manifest" href="/pwa/_platform/manifest.webmanifest" />
    <link rel="apple-touch-icon" id="app-apple-icon" href="/pwa/_platform/icon-192.png" />
    <meta name="theme-color" content="#1E6F52" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Real Estate" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

</html>
